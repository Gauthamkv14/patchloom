services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: patchloom-backend
    expose:
      - "8000"
    environment:
      - APP_ENV=production
      - DEMO_MODE=${DEMO_MODE:-0}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - TRUSTED_PROXIES=127.0.0.1,172.28.0.10
    restart: unless-stopped
    networks:
      patchloom-network:
        ipv4_address: 172.28.0.20

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: patchloom-frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      patchloom-network:
        ipv4_address: 172.28.0.10

networks:
  patchloom-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/24
